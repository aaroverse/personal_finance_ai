<!-- 개인 금융 장부의 간결한 반응형 화면을 구성합니다. -->
<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的账本 · Personal Finance</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">Personal Finance</a><span class="local"><i aria-hidden="true"></i> 私人账本</span></header>
  <main>
    <section class="intro"><div><h1>我的账本</h1><p id="period-label" class="muted">本月已确认消费</p></div><button id="refresh" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>刷新</button></section>
    <p id="status" class="status" role="status" aria-live="polite">正在读取账本…</p>
    <div id="content" hidden>
      <section class="summary" aria-label="已确认消费汇总"><div id="totals" class="totals"></div><details class="summary-help"><summary>统计范围</summary><p>按当前筛选分别汇总各币种，待确认、转账和取现不计入消费。</p></details></section>
      <div class="workspace">
        <section class="ledger" aria-labelledby="ledger-heading">
          <form id="filters" class="filters" aria-label="筛选账本">
            <div class="filter-main">
              <label class="month-label" for="month">月份<input id="month" name="month" type="month"></label>
              <label class="search" for="search">搜索<input id="search" name="q" type="search" maxlength="200" placeholder="商户或备注"></label>
              <button type="submit" class="primary">应用</button>
              <details id="advanced-filters" class="advanced-filters"><summary id="filter-label">更多筛选</summary><div class="filter-extra">
                <label for="account">付款账户<select id="account" name="account"><option value="">全部账户</option></select></label>
                <label for="currency">币种<select id="currency" name="currency"><option value="">全部币种</option></select></label>
                <label for="category">分类<select id="category" name="category"><option value="">全部分类</option></select></label>
                <button type="button" id="clear-filters" class="quiet">清除筛选</button>
              </div></details>
            </div>
          </form>
          <div class="section-heading"><h2 id="ledger-heading" class="sr-only">交易记录</h2><div class="tabs" role="group" aria-label="记录状态"><button id="confirmed-tab" aria-pressed="true" type="button">已确认</button><button id="pending-tab" aria-pressed="false" type="button">待确认</button></div><span id="record-count" class="muted"></span></div>
          <p id="pending-note" class="notice" hidden>待确认记录请回 Telegram 确认或取消。</p>
          <div class="table-head" aria-hidden="true"><span>交易</span><span>分类与账户</span><span>金额</span></div>
          <div id="records"></div>
          <div class="pagination"><button type="button" id="previous" class="quiet">上一页</button><span id="page-label"></span><button type="button" id="next" class="quiet">下一页</button></div>
        </section>
        <aside class="breakdown" aria-labelledby="breakdown-heading"><h2 id="breakdown-heading">分类支出</h2><div id="categories"></div></aside>
      </div>
    </div>
    <footer><span id="updated"></span></footer>
  </main>
  <dialog id="detail"><div class="dialog-top"><span class="muted">交易详情</span><button id="close-detail" type="button" class="quiet" aria-label="关闭详情">关闭 ×</button></div><h2 id="detail-title"></h2><p id="detail-amount" class="detail-amount"></p><dl id="detail-fields"></dl><p class="detail-note">待确认记录请在 Telegram 审核。</p></dialog>
</body>
</html>
